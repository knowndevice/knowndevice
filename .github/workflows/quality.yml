name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      race_timing_count:
        description: "Also measure timing-bound race tests with go test -count N (0 skips)"
        type: number
        default: 0

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Run the same local gate
        run: make check
      - name: Measure timing-bound race tests
        if: inputs.race_timing_count > 0
        env:
          COUNT: ${{ inputs.race_timing_count }}
        run: python3 scripts/race_timing.py run --out .cache/timing/hosted --count "$COUNT"
      - name: Run documented model examples
        run: make demo
      - name: Run the native reference and profile lab matrix
        run: bash scripts/lab_matrix.sh "${{ matrix.arch }}"
