name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      race_timing_count:
        description: "Also measure timing-bound race tests with go test -count N (0 skips)"
        type: number
        default: 0

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Run the same local gate
        run: make check
      - name: Measure timing-bound race tests
        if: inputs.race_timing_count > 0
        env:
          COUNT: ${{ inputs.race_timing_count }}
        run: python3 scripts/race_timing.py run --out .cache/timing/hosted --count "$COUNT"
      - name: Run documented model examples
        run: make demo
      - name: Run the native reference and profile lab matrix
        # A hang fails this step, so the scan and upload below still run.
        timeout-minutes: 50
        env:
          KNOWNDEVICE_MATRIX_DIR: ${{ runner.temp }}/knowndevice-lab-matrix
          ARCH: ${{ matrix.arch }}
        run: bash scripts/lab_matrix.sh "$ARCH"
      # The matrix directory also holds generated demo keys outside logs/;
      # only logs/ and summary.txt may leave the runner, and only after the scan.
      - name: Scan lab logs for secret markers
        id: scan
        if: failure()
        env:
          MATRIX_DIR: ${{ runner.temp }}/knowndevice-lab-matrix
        run: |
          if [[ ! -d "$MATRIX_DIR/logs" ]]; then
            echo "The lab matrix did not start; no logs to upload."
            exit 0
          fi
          python3 scripts/secret_scan.py "$MATRIX_DIR/logs" --file "$MATRIX_DIR/summary.txt"
          echo "upload=true" >> "$GITHUB_OUTPUT"
      - name: Upload lab logs
        if: failure() && steps.scan.outputs.upload == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-matrix-logs-${{ matrix.arch }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/knowndevice-lab-matrix/logs/
            ${{ runner.temp }}/knowndevice-lab-matrix/summary.txt
          if-no-files-found: warn
          retention-days: 14

  filesystem-faults:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Run the filesystem-fault profiles
        # A hang fails this step, so the scan and upload below still run. The limit
        # covers twelve runs at the script's test timeout, the builds and the image pull.
        timeout-minutes: 40
        env:
          KNOWNDEVICE_FS_FAULT_DIR: ${{ runner.temp }}/knowndevice-fs-faults
        run: bash scripts/fs_faults.sh --execute
      # The results directory also holds generated test keys in mounts/; only
      # logs/ and summary.txt may leave the runner, and only after the scan.
      - name: Scan filesystem-fault results for secret markers
        id: fault_scan
        if: ${{ !cancelled() }}
        env:
          FAULT_DIR: ${{ runner.temp }}/knowndevice-fs-faults
        run: |
          if [[ ! -d "$FAULT_DIR/logs" ]]; then
            echo "The filesystem-fault script did not start; no results to upload."
            exit 0
          fi
          python3 scripts/secret_scan.py "$FAULT_DIR/logs" --file "$FAULT_DIR/summary.txt"
          echo "upload=true" >> "$GITHUB_OUTPUT"
      - name: Upload filesystem-fault results
        if: ${{ !cancelled() && steps.fault_scan.outputs.upload == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fs-fault-results-${{ matrix.arch }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/knowndevice-fs-faults/logs/
            ${{ runner.temp }}/knowndevice-fs-faults/summary.txt
          if-no-files-found: warn
          retention-days: 14
