name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      KNOWNDEVICE_LAB_ARCH: ${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Run the same local gate
        run: make check
      - name: Run documented model examples
        run: make demo
      - name: Generate unique reference credentials
        run: bin/kd-reference seed --dir .work/reference
      - name: Run the pinned reference failure matrix
        run: |
          docker compose -f lab/compose.yaml up -d
          docker compose -f lab/compose.yaml run --rm checks
      - name: Stop only the reference lab
        if: always()
        run: docker compose -f lab/compose.yaml down
